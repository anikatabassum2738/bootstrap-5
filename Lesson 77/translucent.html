<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark">
    <h1>Translucent Toasts</h1>

    <div class="container mt-3">
        <div class="row justify-content-center mb-3">
            <div class="col-md-8">

                <button
                    type="button"
                    class="btn btn-primary"
                    id="liveToastBtn">
                    Show live toast
                </button>

                <div
                    class="toast position-fixed bottom-0 end-0 me-2 mb-2"
                    role="alert"
                    aria-live="assertive"
                    aria-atomic="true"
                    id="liveToast">
                    <div class="toast-header">
                        <img class="rounded me-2" style="width: 15px; height: 15px;" src="https://png.pngtree.com/png-clipart/20240717/original/pngtree-creative-logo-design-illustration-png-image_15579132.png" alt="">
                        <strong class="me-auto">Bootstrap</strong>
                        <small class="text-muted">10 mins ago</small>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="toast"
                            aria-label="Close">
                        </button>
                    </div>
                    <div class="toast-body">
                        Hello, World! this is a toast message
                    </div>
                </div>

            </div>
        </div>
    </div>




    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="enable-stuff.js"></script>

    <script>
        const toastTrigger = document.getElementById('liveToastBtn')
        const toastLiveExample = document.getElementById('liveToast')
        if(toastTrigger) {
            toastTrigger.addEventListener('click', () => {
                const toast = new bootstrap.Toast(toastLiveExample)
                toast.show()
            })
        }
    </script>

</body>
</html>
