<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .h-10 {
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Figures in Bootstrap</h1>

    <div class="container mt-3">
        <div class="row">
            <div class="col-md-4">
                <figure class="figure text-start">
                    <img class="figure-img img-fluid rounded" src="https://thumbs.dreamstime.com/b/happy-woman-standing-her-back-sunset-nature-iwith-ope-summer-open-hands-94551325.jpg" alt="">
                    <figcaption class="figure-caption">Image Caption</figcaption>
                </figure>
            </div>
            <div class="col-md-4">
                <figure class="figure text-center">
                    <img class="figure-img img-fluid rounded" src="https://thumbs.dreamstime.com/b/happy-woman-standing-her-back-sunset-nature-iwith-ope-summer-open-hands-94551325.jpg" alt="">
                    <figcaption class="figure-caption">Image Caption</figcaption>
                </figure>
            </div>
            <div class="col-md-4">
                <figure class="figure text-end">
                    <img class="figure-img img-fluid rounded" src="https://thumbs.dreamstime.com/b/happy-woman-standing-her-back-sunset-nature-iwith-ope-summer-open-hands-94551325.jpg" alt="">
                    <figcaption class="figure-caption">Image Caption</figcaption>
                </figure>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
