<head>

<body>

    <div class="container mt-5">

            </div>

            <div class="container mt-5">
                <div class="row">
                    <div class="col-md-12">
                    <img style="width: 300px;" class="img-fluid  img-thumbnail float-start" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBXESSnNXiE9dSDJe1rDXCXIzTQ0hWyb-cRfe5bYDdyO-ePTv0VVttYik&s=10" alt="">

                    <img style="width: 300px;" class="img-fluid  img-thumbnail mx-auto d-block" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBXESSnNXiE9dSDJe1rDXCXIzTQ0hWyb-cRfe5bYDdyO-ePTv0VVttYik&s=10" alt="">
                </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
