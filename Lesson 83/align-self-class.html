<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        .custom-height {
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Flex Align Self</h1>

    <div class="container mt-3">
        <div class="row justify-content-center mb-3 mt-5">
            <div class="col-md-8">
                
               <div class="d-flex mb-3 bg-info custom-height align-items-stretch">
                    <div class="p-2 text-bg-primary m-1">Flex Item 1</div>
                    <div class="p-2 text-bg-primary m-1 align-self-start">Flex Item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex Item 3</div>
               </div>
                
               <div class="d-flex mb-3 bg-info custom-height align-items-stretch">
                    <div class="p-2 text-bg-primary m-1">Flex Item 1</div>
                    <div class="p-2 text-bg-primary m-1 align-self-center">Flex Item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex Item 3</div>
               </div>
                
               <div class="d-flex mb-3 bg-info custom-height align-items-stretch">
                    <div class="p-2 text-bg-primary m-1">Flex Item 1</div>
                    <div class="p-2 text-bg-primary m-1 align-self-baseline">Flex Item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex Item 3</div>
               </div>
               <div class="d-flex mb-3 bg-info custom-height align-items-stretch">
                    <div class="p-2 text-bg-primary m-1">Flex Item 1</div>
                    <div class="p-2 text-bg-primary m-1 align-self-stretch">Flex Item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex Item 3</div>
               </div>
               <div class="d-flex mb-3 bg-info custom-height align-items-end">
                    <div class="p-2 text-bg-primary m-1">Flex Item 1</div>
                    <div class="p-2 text-bg-primary m-1 align-self-baseline">Flex Item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex Item 3</div>
               </div>

               <!-- breakpoints -->

               <div class="d-flex mb-3 bg-info custom-height align-items-stretch">
                    <div class="p-2 text-bg-primary m-1">Flex Item 1</div>
                    <div class="p-2 text-bg-warning m-1 align-self-md-start align-self-sm-end">Flex Item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex Item 3</div>
               </div>
                

            </div>
        </div>
    </div>




    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="enable-stuff.js"></script>

</body>
</html>
