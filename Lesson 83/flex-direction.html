<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <h1>Flex Direction</h1>

    <div class="container mt-3">
        <div class="row justify-content-center mb-3 mt-5">
            <div class="col-md-8">
                
                <!-- rows -->
               <div class="d-flex flex-row mb-3 bg-info">
                    <div class="p-2 text-bg-primary m-1">Flex item 1</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 3</div>
               </div>
               <div class="d-flex flex-row-reverse mb-3 bg-info">
                    <div class="p-2 text-bg-primary m-1">Flex item 1</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 3</div>
               </div>

               <!-- columns -->
               <div class="d-flex flex-column mb-3 bg-info">
                    <div class="p-2 text-bg-primary m-1">Flex item 1</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 3</div>
               </div>
               <div class="d-flex flex-column-reverse mb-3 bg-info">
                    <div class="p-2 text-bg-primary m-1">Flex item 1</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 3</div>
               </div>

               <!-- breakpoint -->
                <div class="d-flex flex-md-column flex-sm-row mb-3 bg-info">
                    <div class="p-2 text-bg-primary m-1">Flex item 1</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 3</div>
               </div>
               <div class="d-flex flex-md-column-reverse flex-sm-row-reverse mb-3 bg-info">
                    <div class="p-2 text-bg-primary m-1">Flex item 1</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 2</div>
                    <div class="p-2 text-bg-primary m-1">Flex item 3</div>
               </div>

            </div>
        </div>
    </div>




    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="enable-stuff.js"></script>

</body>
</html>
