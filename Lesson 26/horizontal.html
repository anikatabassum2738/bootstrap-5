<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <h1>Checks and Radios</h1>

    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <form>
                    <h3>Checks</h3>
                    <div class="form-check form-check-reverse">
                        <input type="checkbox" class="form-check-input" value="Checked" id="defaultCheckBox">
                        <label for="defaultCheckBox" class="form-check-label">Default Checkbox</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input" value="Checked" id="defaultCheckBox" checked>
                        <label for="defaultCheckBox" class="form-check-label">Default Checkbox</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input" value="Checked" id="defaultCheckBox1" checked>
                        <label for="defaultCheckBox1" class="form-check-label">Default Checkbox</label>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
