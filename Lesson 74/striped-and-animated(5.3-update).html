<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <h1>Progress Bars New Update - Striped and Animated</h1>

    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <!-- 25% progress -->
                <div
                    class="progress mb-3"
                    role="progressbar"
                    aria-label="Basic Example"
                    aria-valuenow="25"
                    aria-valuemin="0"
                    aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped progress-bar-animated text-bg-dark" style="width: 25%;"></div>
                </div>

                <!-- 50% progress -->
                <div
                    class="progress mb-3"
                    role="progressbar"
                    aria-label="Basic Example"
                    aria-valuenow="50"
                    aria-valuemin="0"
                    aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped progress-bar-animated text-bg-primary" style="width: 50%;"></div>
                </div>

                <!-- 75% progress -->
                <div
                    class="progress mb-3"
                    role="progressbar"
                    aria-label="Basic Example"
                    aria-valuenow="75"
                    aria-valuemin="0"
                    aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped progress-bar-animated text-bg-success" style="width: 75%;"></div>
                </div>

                <!-- 100% progress -->
                <div
                    class="progress mb-3"
                    role="progressbar"
                    aria-label="Basic Example"
                    aria-valuenow="100"
                    aria-valuemin="0"
                    aria-valuemax="100">
                    <div class="progress-bar progress-bar-striped progress-bar-animated text-bg-danger" style="width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>




    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="enable-stuff.js"></script>

</body>
</html>
