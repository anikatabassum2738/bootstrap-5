<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <h1>Progress Bars New Update - Stacked Progress Bar</h1>

    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-8">
                

                <!-- 1st progress -->
                <div class="progress-stacked">
                    <div
                        class="progress"
                        role="progressbar"
                        aria-label="Segment one"
                        aria-valuenow="15"
                        aria-valuemin="0"
                        aria-valuemax="100"
                        style="width: 15%;">
                        <div class="progress-bar text-bg-dark">
                            15% Percent
                        </div>
                    </div>

                    <!-- 2nd progress -->
                    <div
                        class="progress"
                        role="progressbar"
                        aria-label="Segment two"
                        aria-valuenow="30"
                        aria-valuemin="0"
                        aria-valuemax="100"
                        style="width: 30%;">
                        <div class="progress-bar text-bg-primary">
                            30% Percent
                        </div>
                    </div>

                    <!-- 3rd progress -->
                    <div
                        class="progress"
                        role="progressbar"
                        aria-label="Segment three"
                        aria-valuenow="20"
                        aria-valuemin="0"
                        aria-valuemax="100"
                        style="width: 20%;">
                        <div class="progress-bar text-bg-info">
                            20% Percent
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>




    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="enable-stuff.js"></script>

</body>
</html>
