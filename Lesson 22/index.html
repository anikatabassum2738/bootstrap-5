<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .h-10 {
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Forms in Bootstrap</h1>

    <div class="container mt-3">
        <div class="row">
            <div class="col-md-8">
                <form>
                    <fieldset>
                        <legend>
                            Login to continue
                        </legend>
                        <div class="mb-6">
                            <label class="form-label" for="u_name">Username</label>
                            <input class="form-control" type="text" id="u_name">
                        </div>
                        <div class="mb-6">
                            <label class="form-label" for="u_pass">Password</label>
                            <input class="form-control" type="password" id="u-pass">
                        </div>
                        <button class="btn btn-success" type="submit">Login</button>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
