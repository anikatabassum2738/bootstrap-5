<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body{
            padding-top: 20%;
        }
    </style>

</head>
<body>
    <h1>Dropup and Dropdown Alignment</h1>

    <div class="container mt-3">
         <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="dropup-center dropup">
                    <button
                        class="btn btn-secondary dropdown-toggle"
                        type="button"
                        id="dropup-center-btn"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                        Centered Dropup
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropup-center-btn">
                        <li><a href="#" class="dropdown-item">One</a></li>
                        <li><a href="#" class="dropdown-item">Two</a></li>
                        <li><a href="#" class="dropdown-item">Three</a></li>
                        <li><a href="#" class="dropdown-item">Four</a></li>
                    </ul>
                </div>

                <div class="btn-group dropend mt-3">
                    <button
                        class="btn btn-secondary dropdown-toggle"
                        type="button"
                        id="dropup-center-btn"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                        Centered Dropup
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropup-center-btn">
                        <li><a href="#" class="dropdown-item">One</a></li>
                        <li><a href="#" class="dropdown-item">Two</a></li>
                        <li><a href="#" class="dropdown-item">Three</a></li>
                        <li><a href="#" class="dropdown-item">Four</a></li>
                    </ul>
                </div>

                <div class="btn-group dropend mt-3">
                    <button
                        type="button"
                        class="btn btn-success">
                        Split Button
                    </button>
                    <button
                        class="btn btn-success dropdown-toggle dropdown-toggle-split"
                        type="button"
                        id="dropup-center-btn"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <span class="visually-hidden">Toggle Dropdown</span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropup-center-btn">
                        <li><a href="#" class="dropdown-item">One</a></li>
                        <li><a href="#" class="dropdown-item">Two</a></li>
                        <li><a href="#" class="dropdown-item">Three</a></li>
                        <li><a href="#" class="dropdown-item">Four</a></li>
                    </ul>
                </div>
            </div>
         </div>
    </div>
    
    <div class="container mt-3">
         <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="btn-group dropstart mt-3">
                    <button
                        class="btn btn-secondary dropdown-toggle"
                        type="button"
                        id="dropup-center-btn"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                        Drop Start
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropup-center-btn">
                        <li><a href="#" class="dropdown-item">One</a></li>
                        <li><a href="#" class="dropdown-item">Two</a></li>
                        <li><a href="#" class="dropdown-item">Three</a></li>
                        <li><a href="#" class="dropdown-item">Four</a></li>
                    </ul>
                </div>

                <div class="btn-group dropstart mt-3">
                    
                    <button
                        class="btn btn-success dropdown-toggle dropdown-toggle-split"
                        type="button"
                        id="dropup-center-btn"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <span class="visually-hidden">Toggle Dropdown</span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropup-center-btn">
                        <li><a href="#" class="dropdown-item">One</a></li>
                        <li><a href="#" class="dropdown-item">Two</a></li>
                        <li><a href="#" class="dropdown-item">Three</a></li>
                        <li><a href="#" class="dropdown-item">Four</a></li>
                    </ul>
                    <button
                        type="button"
                        class="btn btn-success">
                        Split Drop Start
                    </button>
                </div>
            </div>
         </div>
    </div>


    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
