<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <h1>Font Weights and Italics</h1>

    <div class="container mt-3">
        <div class="row justify-content-center mb-3 mt-5">
            <div class="col-md-8">
                <p class="fw-bold">Bold Text</p>
                <p class="fw-bolder">Bolder Text</p>
                <p class="fw-semibold">Semibold Text</p>
                <p class="fw-normal">Normal Text</p>
                <p class="fw-light">light Text</p>
                <p class="fw-lighter">Lighter Text</p>
                <p class="fst-italic">Italic Text</p>
                <p class="fst-normal">Text with normal font size</p>
            </div>    
        </div>
    </div>




    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="enable-stuff.js"></script>
